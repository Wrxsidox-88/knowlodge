<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识图谱智能问答系统</title>
    <script>
      // 首屏前应用已保存的主题，避免深色/浅色闪烁（WinUI 使用 theme-light/theme-dark 类）
      try {
        var savedTheme = localStorage.getItem('kl_theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = savedTheme;
        document.documentElement.classList.add(savedTheme === 'light' ? 'theme-light' : 'theme-dark');
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.classList.add('theme-dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
